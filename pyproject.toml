[project]
name = "multi-product-analytics"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.18,<3.19",
  "dj-database-url>=2.3,<4",
  "mcp>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "I001"]
