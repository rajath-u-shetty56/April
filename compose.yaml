services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - analytics-postgres-data:/var/lib/postgresql/data

volumes:
  analytics-postgres-data:

